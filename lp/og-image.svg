<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaf8f1"/>
      <stop offset="100%" style="stop-color:#d4f0e2"/>
    </linearGradient>
    <!-- 右側パネル背景 -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a46"/>
      <stop offset="100%" style="stop-color:#1f4d33"/>
    </linearGradient>
    <!-- カード影 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1e4d33" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1e4d33" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 右側グリーンパネル -->
  <rect x="700" y="0" width="500" height="630" fill="url(#panel)"/>

  <!-- 左側：テキストエリア -->

  <!-- ロゴアイコン -->
  <rect x="72" y="72" width="52" height="52" rx="14" fill="#4caf7d"/>
  <rect x="82" y="86" width="32" height="29" rx="3" fill="none" stroke="white" stroke-width="2.2"/>
  <line x1="82" y1="95" x2="114" y2="95" stroke="white" stroke-width="2.2"/>
  <line x1="97" y1="82" x2="97" y2="90" stroke="white" stroke-width="2.2"/>
  <line x1="107" y1="82" x2="107" y2="90" stroke="white" stroke-width="2.2"/>

  <!-- アプリ名 -->
  <text x="138" y="106" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="26" font-weight="900" fill="#1f4d33">おうちリズム</text>

  <!-- バッジ -->
  <rect x="72" y="148" width="154" height="32" rx="16" fill="#fef3d8" stroke="#f5d080" stroke-width="1.5"/>
  <text x="149" y="169" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="13" font-weight="800" fill="#e8a020" text-anchor="middle" letter-spacing="0.5">無料・登録不要で使える</text>

  <!-- メインキャッチコピー -->
  <text x="72" y="248" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="56" font-weight="900" fill="#1a3a2a">家事の予定表を</text>
  <text x="72" y="320" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="56" font-weight="900" fill="#3a8a5c">かんたんに作れる</text>
  <text x="72" y="392" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="56" font-weight="900" fill="#1a3a2a">ウェブアプリ</text>

  <!-- サブテキスト -->
  <text x="72" y="448" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="20" fill="#7a9b8a">掃除・洗濯・キッチン… 毎日の家事をカレンダーで一元管理</text>

  <!-- URL -->
  <text x="72" y="558" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="18" fill="#4caf7d" font-weight="700">kakusan-25200.web.app</text>

  <!-- 右側パネル：モックアップカード -->
  <rect x="740" y="60" width="420" height="510" rx="20" fill="white" filter="url(#shadow)"/>

  <!-- カードトップバー -->
  <rect x="740" y="60" width="420" height="56" rx="20" fill="white"/>
  <rect x="740" y="96" width="420" height="20" fill="white"/>
  <text x="774" y="95" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="18" font-weight="900" fill="#1f4d33">2025年7月</text>
  <!-- ナビボタン -->
  <circle cx="1110" cy="88" r="14" fill="#eaf8f1"/>
  <text x="1110" y="94" font-family="sans-serif" font-size="16" fill="#3a8a5c" text-anchor="middle">›</text>
  <circle cx="1080" cy="88" r="14" fill="#eaf8f1"/>
  <text x="1080" y="94" font-family="sans-serif" font-size="16" fill="#3a8a5c" text-anchor="middle">‹</text>

  <!-- 区切り線 -->
  <line x1="740" y1="116" x2="1160" y2="116" stroke="#d0e8d8" stroke-width="1"/>

  <!-- ジャンルタグ -->
  <rect x="758" y="124" width="68" height="24" rx="12" fill="#e0f0fa"/>
  <text x="792" y="140" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="11" font-weight="700" fill="#4a90c4" text-anchor="middle">トイレ</text>
  <rect x="834" y="124" width="80" height="24" rx="12" fill="#fef3d8"/>
  <text x="874" y="140" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="11" font-weight="700" fill="#e8a020" text-anchor="middle">キッチン</text>
  <rect x="922" y="124" width="68" height="24" rx="12" fill="#e0f5f4"/>
  <text x="956" y="140" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="11" font-weight="700" fill="#3aada8" text-anchor="middle">浴室</text>

  <!-- 曜日ヘッダー -->
  <g font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="11" font-weight="700" fill="#7a9b8a" text-anchor="middle">
    <text x="780" y="172">日</text>
    <text x="840" y="172">月</text>
    <text x="900" y="172">火</text>
    <text x="960" y="172">水</text>
    <text x="1020" y="172">木</text>
    <text x="1080" y="172">金</text>
    <text x="1140" y="172" fill="#d96b6b">土</text>
  </g>

  <!-- カレンダー日付 -->
  <g font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <!-- 行1 -->
    <text x="840" y="205" fill="#3d5247">1</text>
    <!-- ドット -->
    <circle cx="840" cy="212" r="3" fill="#4caf7d"/>
    <text x="900" y="205" fill="#3d5247">2</text>
    <rect x="940" y="185" width="40" height="36" rx="8" fill="#eaf8f1"/>
    <text x="960" y="208" fill="#3d5247">3</text>
    <circle cx="960" cy="215" r="3" fill="#4caf7d"/>
    <text x="1020" y="205" fill="#3d5247">4</text>
    <text x="1080" y="205" fill="#3d5247">5</text>
    <circle cx="1080" cy="212" r="3" fill="#4caf7d"/>
    <!-- 行2 -->
    <text x="780" y="248" fill="#3d5247">6</text>
    <text x="840" y="248" fill="#3d5247">7</text>
    <circle cx="840" cy="255" r="3" fill="#4caf7d"/>
    <text x="900" y="248" fill="#3d5247">8</text>
    <text x="960" y="248" fill="#3d5247">9</text>
    <circle cx="960" cy="255" r="3" fill="#4caf7d"/>
    <text x="1020" y="248" fill="#3d5247">10</text>
    <text x="1080" y="248" fill="#3d5247">11</text>
    <text x="1140" y="248" fill="#3d5247">12</text>
    <!-- TODAY -->
    <circle cx="780" cy="288" r="18" fill="#4caf7d"/>
    <text x="780" y="294" fill="white" font-weight="900">13</text>
    <!-- 行3 -->
    <text x="840" y="295" fill="#3d5247">14</text>
    <circle cx="840" cy="302" r="3" fill="#4caf7d"/>
    <text x="900" y="295" fill="#3d5247">15</text>
    <text x="960" y="295" fill="#3d5247">16</text>
    <circle cx="960" cy="302" r="3" fill="#4caf7d"/>
    <text x="1020" y="295" fill="#3d5247">17</text>
    <text x="1080" y="295" fill="#3d5247">18</text>
    <text x="1140" y="295" fill="#3d5247">19</text>
  </g>

  <!-- 区切り線 -->
  <line x1="740" y1="324" x2="1160" y2="324" stroke="#d0e8d8" stroke-width="1"/>

  <!-- タスクパネル -->
  <text x="758" y="348" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="11" fill="#7a9b8a">7月13日（日）のタスク</text>

  <!-- タスク1 -->
  <rect x="758" y="356" width="382" height="52" rx="10" fill="#f4fbf7" filter="url(#shadow-sm)"/>
  <rect x="770" y="368" width="28" height="28" rx="8" fill="#e0f0fa"/>
  <text x="784" y="387" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#4a90c4">🚽</text>
  <text x="810" y="378" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="13" font-weight="700" fill="#1f4d33">トイレ掃除</text>
  <text x="810" y="396" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="11" fill="#7a9b8a">週1 · 軽め（5分以内）</text>
  <!-- チェック済み -->
  <circle cx="1118" cy="382" r="12" fill="#4caf7d"/>
  <polyline points="1112,382 1116,387 1124,376" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- タスク2 -->
  <rect x="758" y="416" width="382" height="52" rx="10" fill="#f4fbf7" filter="url(#shadow-sm)"/>
  <rect x="770" y="428" width="28" height="28" rx="8" fill="#fef3d8"/>
  <text x="784" y="447" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8a020">🍳</text>
  <text x="810" y="438" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="13" font-weight="700" fill="#1f4d33">コンロ掃除</text>
  <text x="810" y="456" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="11" fill="#7a9b8a">月1 · 普通（15分）</text>
  <!-- 未チェック -->
  <circle cx="1118" cy="442" r="12" fill="none" stroke="#d0e8d8" stroke-width="2"/>

  <!-- タスク3 -->
  <rect x="758" y="476" width="382" height="52" rx="10" fill="#f4fbf7" filter="url(#shadow-sm)"/>
  <rect x="770" y="488" width="28" height="28" rx="8" fill="#e0f5f4"/>
  <text x="784" y="507" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#3aada8">🛁</text>
  <text x="810" y="498" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="13" font-weight="700" fill="#1f4d33">浴室掃除</text>
  <text x="810" y="516" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="11" fill="#7a9b8a">週1 · 普通（15分）</text>
  <circle cx="1118" cy="502" r="12" fill="none" stroke="#d0e8d8" stroke-width="2"/>
</svg>
